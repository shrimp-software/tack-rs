[package]
name = "tack-runtime-quickjs"
version.workspace = true
description = "QuickJS and Oxc runtime for executing tool-backed TypeScript snippets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["typescript", "quickjs", "scripting", "automation", "runtime"]
categories = ["development-tools"]

[dependencies]
async-trait.workspace = true
oxc_allocator = "=0.120.0"
oxc_ast = "=0.120.0"
oxc_ast_visit = "=0.120.0"
oxc_diagnostics = "=0.120.0"
oxc_parser = "=0.120.0"
oxc_span = "=0.120.0"
rquickjs = { version = "=0.12.2", features = ["futures"] }
serde.workspace = true
serde_json.workspace = true
tack-core.workspace = true
thiserror.workspace = true
tokio.workspace = true
