[workspace]
resolver = "3"
members = [
  "crates/tack-codemode",
  "crates/tack-runtime-quickjs",
]

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tack-sh/tack-rs"

[workspace.dependencies]
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tack-codemode = { path = "crates/tack-codemode", version = "1.0.3" }
