[workspace]
resolver = "3"
members = [
  "crates/tack-core",
  "crates/tack-macros",
  "crates/tack-runtime-quickjs",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/shrimp-software/tack-rs"

[workspace.dependencies]
async-trait = "0.1.89"
proc-macro2 = "1"
quote = "1"
schemars = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = "2"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "time", "sync"] }
tack-core = { path = "crates/tack-core", version = "0.0.3" }
